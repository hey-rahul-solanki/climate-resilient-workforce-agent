services:
  # Unified FastAPI service for calendar APIs and MCP-backed agent calls.
  calendar-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKFORCE_PYTHON_EXTRAS: ${CALENDAR_BACKEND_PYTHON_EXTRAS:-api,mcp,vertex}
    container_name: calendar-backend
    restart: unless-stopped
    command: ["uvicorn", "calendar_backend.main:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "${CALENDAR_BACKEND_PORT:-8010}:8010"
    environment:
      - WORKFORCE_AGENT_CREDENTIALS=${WORKFORCE_AGENT_CREDENTIALS:-{}}
      - WORKFORCE_AGENT_TOKEN=${WORKFORCE_AGENT_TOKEN:-}
      - WORKFORCE_AGENT_DEMO_ENABLED=${WORKFORCE_AGENT_DEMO_ENABLED:-true}
      - WORKFORCE_AGENT_SECURE_COOKIES=${WORKFORCE_AGENT_SECURE_COOKIES:-false}
      - WORKFORCE_REASONING_PROVIDER=${WORKFORCE_REASONING_PROVIDER:-deterministic}
      - WORKFORCE_VERTEX_PROJECT=${WORKFORCE_VERTEX_PROJECT:-}
      - WORKFORCE_VERTEX_LOCATION=${WORKFORCE_VERTEX_LOCATION:-global}
      - WORKFORCE_VERTEX_MODEL=${WORKFORCE_VERTEX_MODEL:-}
      - WORKFORCE_MODEL_TIMEOUT_SECONDS=${WORKFORCE_MODEL_TIMEOUT_SECONDS:-10}
      - WORKFORCE_MODEL_MAX_OUTPUT_TOKENS=${WORKFORCE_MODEL_MAX_OUTPUT_TOKENS:-2048}
      - WORKFORCE_BACKGROUND_CHECK_SECONDS=${WORKFORCE_BACKGROUND_CHECK_SECONDS:-30}
      - WORKFORCE_WEATHER_SOURCE=${WORKFORCE_WEATHER_SOURCE:-open-meteo}
      - WORKFORCE_DEFAULT_LOCATION_ID=${WORKFORCE_DEFAULT_LOCATION_ID:-vadodara-gujarat}
      - WORKFORCE_WEATHER_STALE_AFTER_MINUTES=${WORKFORCE_WEATHER_STALE_AFTER_MINUTES:-180}
      - WORKFORCE_WEATHER_TIMEOUT_SECONDS=${WORKFORCE_WEATHER_TIMEOUT_SECONDS:-20}
      - PYTHONUNBUFFERED=1
    volumes:
      - approval_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workforce-net

  # ============================================================================
  # React + Vite Frontend Service (Served via Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8010}
    container_name: workforce-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      calendar-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - workforce-net

  # ============================================================================
  # PostgreSQL Database (Optional / Milestone 2 schema persistence)
  # Activated with: docker compose --profile db up
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: workforce-db
    restart: unless-stopped
    profiles:
      - db
      - full
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workforce_db}
      POSTGRES_USER: ${POSTGRES_USER:-workforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforce_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - workforce-net

networks:
  workforce-net:
    driver: bridge

volumes:
  approval_data:
    driver: local
  postgres_data:
    driver: local
