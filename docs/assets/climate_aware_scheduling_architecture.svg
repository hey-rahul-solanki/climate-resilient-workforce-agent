<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Climate-aware scheduling system architecture</title><desc id="desc">Supervisor web app, Cloud Run backend and MCP server, background monitoring agent, operational data sources, approval-gated Google Calendar integration, and external enterprise scheduling consumers using MCP.</desc>
<defs>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0873dc"/></marker>
  <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#079b75"/></marker>
  <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#cf1681"/></marker>
  <marker id="arrowDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0b4c91"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#10234d} .heading{font-size:21px;font-weight:700} .subhead{font-size:16px;font-weight:700} .body{font-size:14px} .small{font-size:12px} .micro{font-size:11px} .blueBox{fill:#eff7ff;fill-opacity:.9;stroke:#2086ff;stroke-width:1.2} .purpleBox{fill:#f8f2ff;fill-opacity:.9;stroke:#a16cff;stroke-width:1.1} .greenBox{fill:#ecfff6;fill-opacity:.9;stroke:#06bd8a;stroke-width:1.1} .orangeBox{fill:#fff9e8;fill-opacity:.95;stroke:#ffad17;stroke-width:1.1} .pinkBox{fill:#fff0f8;fill-opacity:.94;stroke:#ff3aa7;stroke-width:1.1} .whiteCard{fill:#fff;fill-opacity:.84;stroke:#b8d4ff;stroke-width:1} .round{rx:10;ry:10}</style>
</defs>
<rect width="1536" height="1024" fill="#fff"/>
<rect x="10" y="14" width="442" height="390" class="blueBox round"/>
<text x="32" y="48" class="heading" fill="#083ea8">● Supervisor Web App (GCP)</text>
<text x="72" y="77" class="body">Google Calendar-style day view + Climate Agent</text>
<rect x="33" y="102" width="396" height="101" class="whiteCard round"/>
<text x="150" y="137" class="subhead">Frontend</text><text x="150" y="160" class="body">React 19 + TypeScript</text><text x="150" y="181" class="body">Material UI</text>
<rect x="33" y="220" width="396" height="160" class="purpleBox round"/>
<text x="150" y="252" class="subhead">Climate Agent Panel</text><text x="150" y="280" class="body">• Shows proactive suggestions</text><text x="150" y="305" class="body">• Chat with agent</text><text x="150" y="330" class="body">• Review proposed changes</text><text x="150" y="355" class="body">• Approve to update schedule</text>
<path d="M455 184 H548" stroke="#0873dc" stroke-width="3" fill="none" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
<text x="462" y="151" class="small">Chat requests /</text><text x="462" y="168" class="small">user inputs</text><path d="M548 233 H455" stroke="#0873dc" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/><text x="460" y="262" class="small">Suggestions</text><text x="460" y="278" class="small">and explanations</text>
<rect x="552" y="12" width="680" height="508" class="greenBox round"/><text x="580" y="45" class="heading" fill="#07552c">GCP Backend (Cloud Run)</text>
<rect x="574" y="64" width="644" height="439" class="purpleBox round"/><text x="603" y="102" class="heading" fill="#29118a">MCP Server (Climate Workforce Agent)</text><text x="603" y="126" class="body">Agent tools exposed via Model Context Protocol (MCP)</text>
<rect x="586" y="150" width="346" height="181" class="whiteCard round"/><text x="666" y="180" class="subhead">AI Agent <tspan font-weight="400">(Gemini on Vertex AI)</tspan></text><text x="666" y="207" class="body">• Understand supervisor requests</text><text x="666" y="232" class="body">• Generate schedule suggestions</text><text x="666" y="257" class="body">• Explain reasoning</text><text x="666" y="282" class="body">• Use tools via MCP</text>
<rect x="940" y="150" width="265" height="109" class="whiteCard round"/><text x="994" y="173" class="subhead">Agent Session &amp; Memory</text><text x="994" y="193" class="small">(Vertex AI Agent Engine)</text><text x="994" y="215" class="small">• Maintain conversation context</text><text x="994" y="233" class="small">• Store constraints and preferences</text><text x="994" y="250" class="small">• Isolated per supervisor</text>
<rect x="940" y="265" width="265" height="66" class="whiteCard round"/><text x="994" y="285" class="subhead">Model Armor</text><text x="994" y="305" class="small">• Safety, content and prompt protection</text><text x="994" y="322" class="small">• Evaluate inputs and outputs</text>
<path d="M586 343 H1205" stroke="#d2c3ff" stroke-width="1.1"/><text x="588" y="367" class="subhead">MCP Tools (web app and external clients)</text>
<g class="small">
<rect x="586" y="379" width="123" height="109" class="whiteCard round"/><text x="628" y="397" font-weight="700">Get affected</text><text x="628" y="412" font-weight="700">activities</text><text x="596" y="438">Find outdoor</text><text x="596" y="453">activities that</text><text x="596" y="468">overlap warnings</text>
<rect x="715" y="379" width="123" height="109" class="whiteCard round"/><text x="758" y="397" font-weight="700">Get schedule</text><text x="758" y="412" font-weight="700">suggestions</text><text x="725" y="438">Propose safer</text><text x="725" y="453">time slots and</text><text x="725" y="468">reordering</text>
<rect x="844" y="379" width="113" height="109" class="whiteCard round"/><text x="883" y="397" font-weight="700">Validate</text><text x="883" y="412" font-weight="700">proposal</text><text x="854" y="438">Validate with</text><text x="854" y="453">safety policies</text><text x="854" y="468">and constraints</text>
<rect x="963" y="379" width="128" height="109" class="whiteCard round"/><text x="1004" y="397" font-weight="700">Update schedule</text><text x="1004" y="412">(on approval)</text><text x="974" y="438">Apply approved</text><text x="974" y="453">changes to calendar</text><text x="974" y="468">through its API</text>
<rect x="1097" y="379" width="108" height="109" class="whiteCard round"/><text x="1137" y="397" font-weight="700">Get climate</text><text x="1137" y="412" font-weight="700">warnings</text><text x="1107" y="438">Retrieve current</text><text x="1107" y="453">forecast warnings</text><text x="1107" y="468">by place and time</text>
</g>
<rect x="1270" y="15" width="260" height="490" class="orangeBox round"/><text x="1295" y="47" class="heading" font-size="19" fill="#854100">External Consumers</text><text x="1295" y="70" class="subhead" fill="#854100">(via MCP)</text>
<rect x="1282" y="94" width="238" height="151" class="whiteCard round" style="stroke:#ffca54"/><text x="1357" y="128" class="subhead">Scheduling Tools</text><text x="1357" y="148" class="body">(with MCP support)</text><text x="1304" y="183" class="body">• Microsoft Outlook</text><text x="1304" y="207" class="body">• Other enterprise</text><text x="1320" y="225" class="body">schedulers</text>
<rect x="1282" y="266" width="238" height="212" class="whiteCard round" style="stroke:#ffca54"/><text x="1358" y="299" class="subhead">Custom Services</text><text x="1358" y="321" class="body">(via MCP or REST)</text><text x="1303" y="354" class="body">• Consume suggested actions</text><text x="1303" y="380" class="body">• Build custom UI</text><text x="1303" y="406" class="body">• Integrate with internal</text><text x="1320" y="426" class="body">scheduling systems</text>
<path d="M1232 223 H1270" stroke="#079b75" stroke-width="3" fill="none" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/><text x="1235" y="251" class="small">MCP</text><text x="1220" y="267" class="small">(standardized tools)</text>
<rect x="10" y="570" width="1248" height="267" class="pinkBox round"/><text x="33" y="609" class="heading" fill="#c90073">Background Monitoring Agent (Cloud Run + Cloud Scheduler)</text><text x="125" y="640" class="body">• Runs independently on a schedule</text><text x="125" y="662" class="body">• Scans employee schedules from Calendar API (read-only)</text><text x="655" y="640" class="body">• Checks climate warnings and identifies affected outdoor activities</text><text x="655" y="662" class="body">• Updates warnings and suggestions in web app (no calendar changes)</text>
<g>
<rect x="28" y="691" width="260" height="134" class="whiteCard round" style="stroke:#ff91ca"/><text x="91" y="718" class="subhead">1. Fetch schedules</text><text x="91" y="738" class="body">(Read-only)</text><text x="91" y="763" class="body">Read events for all</text><text x="91" y="782" class="body">employees from</text><text x="91" y="801" class="body">Calendar API</text>
<rect x="319" y="691" width="278" height="134" class="whiteCard round" style="stroke:#ff91ca"/><text x="382" y="718" class="subhead">2. Check climate warnings</text><text x="382" y="754" class="body">Get latest forecast and</text><text x="382" y="773" class="body">evaluate by location</text><text x="382" y="792" class="body">and time</text>
<rect x="628" y="691" width="287" height="134" class="whiteCard round" style="stroke:#ff91ca"/><text x="694" y="718" class="subhead">3. Apply rules</text><text x="694" y="746" class="body">• Flag overlapping outdoor</text><text x="709" y="765" class="body">activities and warnings</text><text x="694" y="784" class="body">• Indoor: no weather-only action</text><text x="694" y="803" class="body">• Unknown: needs review</text>
<rect x="948" y="691" width="291" height="134" class="whiteCard round" style="stroke:#ff91ca"/><text x="1012" y="718" class="subhead">4. Update web app data</text><text x="1012" y="746" class="body">• Store flags and suggestions</text><text x="1027" y="765" class="body">in application database</text><text x="1012" y="784" class="body">• UI reflects latest warnings</text><text x="1027" y="803" class="body">and recommendations</text><path d="M288 758 H319" stroke="#0b4c91" stroke-width="2.5" marker-end="url(#arrowDark)"/><path d="M597 758 H628" stroke="#0b4c91" stroke-width="2.5" marker-end="url(#arrowDark)"/><path d="M915 758 H948" stroke="#0b4c91" stroke-width="2.5" marker-end="url(#arrowDark)"/>
</g>
<rect x="10" y="862" width="960" height="152" class="greenBox round"/><text x="33" y="888" class="heading" fill="#07552c">Data Sources</text>
<rect x="28" y="901" width="192" height="98" class="whiteCard round" style="stroke:#90e9c5"/><text x="91" y="924" class="subhead">Weather API</text><text x="91" y="942" class="body">(Open-Meteo / IMD)</text><text x="91" y="965" class="small">Forecasts and alerts</text><text x="91" y="981" class="small">by time and location</text>
<rect x="228" y="901" width="236" height="98" class="whiteCard round" style="stroke:#90e9c5"/><text x="284" y="924" class="subhead">Employee &amp; Location Data</text><text x="284" y="949" class="body">Employees, sites,</text><text x="284" y="968" class="body">and work locations</text>
<rect x="474" y="901" width="262" height="98" class="whiteCard round" style="stroke:#90e9c5"/><text x="531" y="924" class="subhead">Work Orders / Activities</text><text x="531" y="949" class="body">Activity details and</text><text x="531" y="968" class="body">indoor/outdoor classification</text>
<rect x="746" y="901" width="205" height="98" class="whiteCard round" style="stroke:#90e9c5"/><text x="803" y="924" class="subhead">Safety Policies</text><text x="803" y="949" class="body">Heat thresholds,</text><text x="803" y="968" class="body">work-rest rules</text>
<rect x="1010" y="872" width="512" height="135" class="blueBox round"/><text x="1098" y="907" class="heading" font-size="19" fill="#083ea8">Google Calendar API (Read &amp; Write)</text><text x="1100" y="938" class="body">• Read schedules for analysis (background agent)</text><text x="1100" y="963" class="body">• Update events only when supervisor approves</text><text x="1116" y="983" class="body">(schedule changes or note updates)</text>
<path d="M228 570 V408" stroke="#cf1681" stroke-width="3" fill="none" marker-end="url(#arrowPink)"/><text x="244" y="462" class="body" fill="#9e0a62">Updated warnings</text><text x="244" y="482" class="body" fill="#9e0a62">and suggestions</text><text x="244" y="502" class="body" fill="#9e0a62">(visual update only)</text>
<path d="M773 570 V520" stroke="#cf1681" stroke-width="3" fill="none" marker-end="url(#arrowPink)"/><text x="792" y="537" class="small">Read schedules and data</text><text x="792" y="553" class="small">for analysis (no write)</text>
<path d="M1049 488 V558 H1417 V871" stroke="#0b4c91" stroke-width="2.5" fill="none" marker-end="url(#arrowDark)"/><text x="1328" y="790" class="small">Write to calendar</text><text x="1307" y="807" class="small">only after supervisor approval</text><path d="M1049 520 V558" stroke="#0b4c91" stroke-width="2.5" fill="none"/>
<path d="M272 862 V838" stroke="#078b78" stroke-width="2.4" marker-end="url(#arrowGreen)"/><path d="M556 862 V838" stroke="#078b78" stroke-width="2.4" marker-end="url(#arrowGreen)"/><path d="M774 862 V838" stroke="#078b78" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
</svg>