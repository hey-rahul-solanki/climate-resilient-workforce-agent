# ==============================================================================
# Development Compose Override (with Live Hot-Reloading)
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================
services:
  calendar-backend:
    command: ["uvicorn", "calendar_backend.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]
    volumes:
      - ./calendar_backend:/app/calendar_backend
      - ./src:/app/src
      - ./tests:/app/tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8010
      - AGENT_PROXY_TARGET=http://calendar-backend:8010
