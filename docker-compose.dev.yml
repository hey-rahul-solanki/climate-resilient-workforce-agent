# ==============================================================================
# Development Compose Override (with Live Hot-Reloading)
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "workforce_agent.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - PYTHONUNBUFFERED=1
      - WORKFORCE_WEATHER_SOURCE=open-meteo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
